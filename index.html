<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1B1714">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coverrrup">
<meta name="description" content="Let's coverrrup the world!! 지금 있는 곳을 사진 한 장으로 덮어요.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Coverrrup</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#1B1714;--bg-2:#221D19;--card:#241F1B;--map:#1F1B17;--map-line:rgba(241,234,226,.07);--map-line-2:rgba(241,234,226,.18);
  --ink:#F1EAE2;--ink-2:#B7ADA2;--muted:#7E756D;--line:rgba(241,234,226,.10);--line-2:rgba(241,234,226,.22);
  --flag:#E0876F;--flag-ink:#F3B6A4;--flag-dim:rgba(224,135,111,.16);--mint:#9FD8B3;--sky:#8FB6E8;--gold:#E2B54A;--gold-ink:#1B1714;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic","Segoe UI",Roboto,sans-serif;
  --tab-h:66px;--safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#0F0D0B;font-family:var(--sans);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased;font-weight:400}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:1px solid var(--flag);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.phone{position:relative;width:100%;height:100vh;height:100dvh;background:var(--bg);overflow:hidden}
@media (min-width:900px) and (min-height:720px){
  body{background:radial-gradient(900px 700px at 30% 10%,#2A241F,#0F0D0B)}
  .phone{width:402px;height:min(874px,calc(100dvh - 32px));border-radius:44px;box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 11px #0b0a09,0 0 0 13px #2a2622}
}
.screen{position:absolute;inset:0;bottom:calc(var(--tab-h) + var(--safe));display:none;flex-direction:column}
.screen.active{display:flex}
.screen.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tab-h) + var(--safe));padding-bottom:var(--safe);display:flex;background:rgba(27,23,20,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:40}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:400;color:var(--muted)}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--ink)}
.tab.cam .ico{width:44px;height:44px;border-radius:50%;background:var(--flag-dim);border:1px solid var(--flag);display:flex;align-items:center;justify-content:center;color:var(--flag);margin-top:-14px}
.tab.cam svg{width:20px;height:20px}
.tab.cam.active .ico{background:var(--flag);color:var(--bg)}

/* map screen */
.map-wrap{position:relative;flex:1;overflow:hidden;background:var(--map)}
#map{display:block;touch-action:none;cursor:grab;position:absolute;inset:0}
#me{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:5}
#me i{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--flag);border:2px solid var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.5)}
#me::after{content:"";position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;background:rgba(224,135,111,.22);animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){#me::after{animation:none;opacity:.35;transform:none}.sheet{transition:none}}
.map-hdr{position:absolute;top:0;left:0;right:0;padding:16px 18px 30px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;background:linear-gradient(rgba(31,27,23,.97),rgba(31,27,23,.85) 55%,rgba(31,27,23,0));pointer-events:none;z-index:6}
.brand{font-size:13px;font-weight:500;letter-spacing:.22em;color:var(--sky);margin-bottom:10px;line-height:1;display:flex;align-items:center;gap:8px}
.brand::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--sky);box-shadow:inset 0 0 0 2px var(--map),inset 0 0 0 5px var(--sky)}
.place b{display:block;font-size:22px;font-weight:400;letter-spacing:-.01em;line-height:1.15}
.place span{display:block;margin-top:5px;font-size:12px;color:var(--ink-2)}
.lvl{font-size:11px;font-weight:400;border:1px solid var(--line-2);color:var(--ink-2);padding:6px 10px;border-radius:999px;white-space:nowrap;margin-top:32px}
.map-ctl{position:absolute;right:12px;bottom:60px;display:flex;flex-direction:column;gap:8px;z-index:6}
.map-ctl button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:rgba(27,23,20,.85);font-size:20px;font-weight:300;color:var(--ink)}
.map-ctl button.loc{font-size:16px;color:var(--flag);border-color:var(--flag)}
#scalebar{position:absolute;left:14px;bottom:16px;z-index:6;font-size:11px;color:var(--ink-2)}
#scalebar span{display:block;height:5px;border:1px solid var(--ink-2);border-top:0;margin-bottom:4px}
.legend{position:absolute;left:14px;bottom:48px;z-index:6;display:flex;gap:12px;font-size:11px;color:var(--ink-2);align-items:center}
.legend .sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:#4A413A}
.sw.mine{box-shadow:inset 0 0 0 1.5px var(--flag)}
.sw.other{box-shadow:inset 0 0 0 1.5px rgba(241,234,226,.7)}
.sw.empty{background:var(--map);box-shadow:inset 0 0 0 1px var(--map-line-2)}
.hint-float{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(241,234,226,.92);color:var(--bg);font-size:12px;padding:8px 13px;border-radius:999px;z-index:7;pointer-events:none;transition:opacity .5s;white-space:nowrap}
.hint-float.hide{opacity:0}

/* bottom sheet */
#backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
#backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94%;background:var(--card);border-radius:22px 22px 0 0;border-top:1px solid var(--line-2);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:70;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.sheet.open{transform:none}
.sheet .handle{width:36px;height:3px;border-radius:2px;background:var(--line-2);margin:10px auto 6px;flex:none}
.sheet .body{overflow-y:auto;padding:8px 18px calc(18px + var(--safe))}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sh-title{font-size:18px;font-weight:400;letter-spacing:-.01em;line-height:1.25}
.sh-sub{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);margin-top:6px}
.slots{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap;margin-top:4px}
.slots i{width:8px;height:8px;border-radius:50%;background:#3A332D;display:inline-block}
.slots i.on{background:var(--mint)}
.slots span{margin-left:4px}
.cover{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/3;background:#2A241F;border:1px solid var(--line-2)}
.ph{overflow:hidden;background:#2A241F}
.ph img,.cover .ph{width:100%;height:100%;object-fit:cover;display:block}
.cover-badges{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;padding:4px 9px;border-radius:999px;background:rgba(27,23,20,.75);color:var(--ink);border:1px solid var(--line-2);backdrop-filter:blur(6px)}
.badge.gold{border-color:var(--gold);color:var(--gold);background:rgba(27,23,20,.75)}
.badge.dark{background:rgba(27,23,20,.85)}
.plist{margin-top:16px;display:flex;flex-direction:column;gap:0}
.prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.prow .ph.sm{width:44px;height:44px;border-radius:6px;flex:none;border:1px solid var(--line)}
.pinfo{flex:1;min-width:0}
.pinfo b{display:block;font-size:14px;font-weight:400}
.pinfo span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.like{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink-2)}
.like.on{border-color:var(--flag);color:var(--flag);background:var(--flag-dim)}
.empty-cell{padding:22px 16px;border:1px dashed var(--line-2);border-radius:12px;text-align:center}
.empty-cell .big{font-size:16px;font-weight:400}
.empty-cell p{margin:6px 0 0;font-size:13px;color:var(--ink-2);line-height:1.55}
.btn{display:block;width:100%;border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:14px;font-size:14px;font-weight:400;margin-top:14px;color:var(--ink)}
.btn.primary{background:var(--flag);border-color:var(--flag);color:var(--bg)}
.btn.danger{color:var(--flag);border-color:rgba(224,135,111,.5)}
.btn.small{width:auto;padding:8px 14px;font-size:13px;margin:0}
.btn[disabled]{opacity:.45;cursor:default}
.note{margin-top:14px;font-size:13px;color:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.55}
.note.warn{border-color:rgba(224,135,111,.45);color:var(--flag-ink)}
.note .mono{border:1px solid var(--line-2);padding:1px 6px;border-radius:4px;margin-right:4px}
.rule{margin-top:14px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;line-height:1.55}
.link{border:0;background:none;color:var(--sky);font-size:12px;padding:0}
.stats2{display:flex;margin-top:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats2 div{flex:1;padding:14px 6px;text-align:center}
.stats2 div+div{border-left:1px solid var(--line)}
.stats2 b{display:block;font-size:24px;font-weight:300;letter-spacing:-.02em}
.stats2 span{font-size:11px;color:var(--muted)}

/* pages */
.page{padding:18px 16px calc(28px + var(--safe))}
h1{font-size:24px;letter-spacing:-.01em;margin:6px 0 4px;font-weight:400}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px;min-height:1em}
.tagline{font-size:12px;color:var(--sky);letter-spacing:.06em;margin:0 0 6px}
.group{margin-bottom:28px}
.ghead{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.gnum{font-size:11px;border:1px solid var(--line-2);color:var(--ink-2);border-radius:999px;padding:3px 8px;margin-top:1px;white-space:nowrap}
.gtitle{font-size:16px;font-weight:400;letter-spacing:-.01em;line-height:1.3}
.gsub{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:10px}
.cell-item{padding:16px 0;border-top:1px solid var(--line);cursor:pointer}
.cell-item:last-child{border-bottom:1px solid var(--line)}
.chead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.chead .code{font-size:13px;color:var(--ink-2)}
.chead .slot{margin-left:auto;font-size:12px;color:var(--muted)}
.ccover{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:16/10;border:1px solid var(--line-2);background:#2A241F}
.ccover .likes{position:absolute;right:8px;top:8px;background:rgba(27,23,20,.8);color:var(--ink);font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line-2)}
.crow{display:flex;align-items:center;gap:10px;margin-top:10px}
.crow label{font-size:12px;color:var(--muted);width:72px;flex:none}
.thumbs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.th{width:54px;height:54px;border-radius:6px;flex:none;position:relative;border:1px solid var(--line)}
.th span{position:absolute;left:0;right:0;bottom:0;font-size:9px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));padding:8px 4px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.none{font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:48px 16px 20px}
.empty .art{width:120px;height:90px;margin:0 auto 16px;background:
 linear-gradient(var(--map-line-2),var(--map-line-2)) 40px 0/1px 100% no-repeat,
 linear-gradient(var(--map-line-2),var(--map-line-2)) 80px 0/1px 100% no-repeat,
 linear-gradient(var(--map-line-2),var(--map-line-2)) 0 30px/100% 1px no-repeat,
 linear-gradient(var(--map-line-2),var(--map-line-2)) 0 60px/100% 1px no-repeat,var(--map);border-radius:8px;position:relative;border:1px solid var(--line)}
.empty .art::after{content:"";position:absolute;left:42px;top:32px;width:36px;height:26px;border:1.5px dashed var(--flag);border-radius:3px}
.empty h3{margin:10px 0 6px;font-size:18px;font-weight:400}
.empty p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.55}
.empty .btn{width:auto;display:inline-block;padding:12px 22px;margin-top:20px}

/* feed */
.feed-item{border-bottom:1px solid var(--line);padding:18px 0}
.feed-item:first-child{padding-top:4px}
.fhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.fhead b{display:block;font-size:15px;font-weight:400;letter-spacing:-.01em}
.fhead .mono{font-size:12px;color:var(--muted)}
.fdist{font-size:12px;color:var(--mint);border:1px solid rgba(159,216,179,.4);padding:4px 9px;border-radius:999px;white-space:nowrap}
.fphoto{aspect-ratio:4/5;border-radius:12px;border:1px solid var(--line-2);position:relative;background:#2A241F;cursor:pointer}
.fphoto .cover-badges{position:absolute}
.fbar{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.fbar .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmore{border:0;background:none;font-size:13px;color:var(--sky);padding:6px 0}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.fgrid .ph{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);position:relative;cursor:pointer}
.fgrid .ph span{position:absolute;left:0;right:0;bottom:0;font-size:10px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));padding:10px 6px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fend{text-align:center;color:var(--muted);font-size:13px;padding:26px 0 8px;line-height:1.55}

/* camera */
.cam{background:#000;color:#fff}
.cam-top{position:absolute;top:0;left:0;right:0;padding:14px 16px;z-index:5;display:flex;justify-content:center;pointer-events:none}
.chip{background:rgba(0,0,0,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 14px;font-size:12px;color:#fff;max-width:100%;text-align:center;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.chip .mono{color:#B7ADA2}
.chip .st{color:var(--mint)}
.cam-stage{position:relative;flex:1;overflow:hidden;background:#000}
#video,#shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#video.show,#shot.show{display:block}
.fx-vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,var(--vig,0)) 100%)}
.fx-tint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:var(--tint,transparent)}
.cam-stage.fb .fx-vig,.cam-stage.fb .fx-tint{display:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .35s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.cam-fallback{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;text-align:center;background:radial-gradient(circle at 50% 40%,#2A241F,#000)}
.cam-fallback.show{display:flex}
.fb-icon{width:64px;height:64px;border-radius:50%;border:1px dashed rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center}
.fb-icon svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.4;stroke-linejoin:round}
.cam-fallback p{margin:0;color:#B7ADA2;font-size:14px;line-height:1.55;max-width:26ch}
.btn.light{background:var(--ink);color:var(--bg);border-color:var(--ink);width:auto;padding:12px 20px;margin-top:6px;display:inline-block}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35);width:auto;padding:12px 18px;margin:0}
.cam-status{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12px;color:rgba(255,255,255,.8);pointer-events:none}
.cam-bottom{padding:12px 12px calc(12px + var(--safe));background:#000}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#7E756D;padding:0}
.fchip .sw{width:52px;height:52px;border-radius:50%;overflow:hidden;border:1px solid transparent}
.fchip .sw img{width:100%;height:100%;object-fit:cover;display:block}
.fchip.on{color:#fff}
.fchip.on .sw{border-color:var(--flag);box-shadow:0 0 0 2px #000,0 0 0 3px var(--flag)}
.cam-actions{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;min-height:76px}
#retake{grid-column:1;justify-self:end;margin:0;width:auto}
#upload{grid-column:3;justify-self:start;margin:0;width:auto;padding:12px 20px}
.shutter{grid-column:2;width:72px;height:72px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle,#fff 0 58%,transparent 60%);position:relative}
.shutter:active{transform:scale(.94)}
.shutter[disabled]{opacity:.35;cursor:default}
.cam-note{text-align:center;font-size:11px;color:#7E756D;margin-top:10px}

/* profile */
.pf-card{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:14px}
.avatar{width:52px;height:52px;border-radius:50%;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.pf-main{flex:1;min-width:0}
.name-in{font:inherit;font-size:20px;font-weight:400;border:0;border-bottom:1px dashed var(--line-2);background:none;width:100%;padding:2px 0;outline:none;color:var(--ink)}
.pf-since{font-size:12px;color:var(--muted);margin-top:5px}
.stats{display:grid;grid-template-columns:1fr 1fr;margin:16px 0 6px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stats div{padding:16px 18px 14px;text-align:left;border-top:1px solid var(--line)}
.stats div:nth-child(-n+2){border-top:0}
.stats div:nth-child(even){border-left:1px solid var(--line)}
.stats span{display:block;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.stats b{display:block;font-size:26px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stats i{display:block;height:3px;border-radius:2px;background:#3A332D;margin-top:12px;position:relative;overflow:hidden}
.stats i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w,0%);background:var(--c,var(--mint));border-radius:2px;transition:width .5s}
h2{font-size:17px;font-weight:400;letter-spacing:-.01em;margin:28px 0 12px}
.box{border:1px solid var(--line);border-radius:16px;padding:16px}
.ring-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
.ring{position:relative;width:200px;height:200px}
.ring svg{width:100%;height:100%;transform:rotate(135deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}

      <button class="link" id="login-close" data-i18n="login_browse"></button>
    </div>
  </div>
  <div id="toast"></div>
</div>

function roundRect(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);if(r<=0){c.rect(x,y,w,h);return}c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

const map={canvas:null,ctx:null,W:0,H:0,dpr:1,dirty:false,anims:new Map(),ml:null};

function pairsForScale(){const P=pxPerDeg();for(const p of [5,4,3,2])if(OLC.RES[p-1]*P.y>=14)return p;return 1}

let animId=0;
function animateTo(lat,lng,scale,ms){ms=ms||380;cancelAnimationFrame(animId);const l=scaleLimits();scale=clamp(scale,l.min,l.max);const s0={...S.view},t0=performance.now(),ls0=Math.log(s0.scale),ls1=Math.log(scale);

function render(){if(S.tab!=='map'||map.W<50)return;const c=map.ctx,W=map.W,H=map.H;c.setTransform(map.dpr,0,0,map.dpr,0,0);c.clearRect(0,0,W,H);

    drawTile(c,xs[j],ys[i],cw,ch,e,p,k)}

function drawTile(c,x,y,w,h,e,p,k){const pad=w>28?1.5:0.5,rx=x+pad,ry=y+pad,rw=w-pad*2,rh=h-pad*2,rad=w>40?3:w>20?2:0;
  let sc=1;const an=map.anims.get(k);if(an!=null){const tt=(performance.now()-an)/520;if(tt<1){sc=0.6+0.4*(1-Math.pow(1-tt,3));requestRender()}else map.anims.delete(k)}

function bindMapInput(){const el=map.canvas,ptrs=new Map();let last=null,tap=null;
  const snap=()=>{const a=[...ptrs.values()];if(a.length===1)return{cx:a[0].x,cy:a[0].y,d:0};return{cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}};
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});if(ptrs.size===1)tap={x:e.offsetX,y:e.offsetY,t:performance.now(),moved:false};else if(tap)tap.moved=true;last=snap();cancelAnimationFrame(animId)});
  el.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});const now=snap();
    if(last){if(ptrs.size===1){panBy(now.cx-last.cx,now.cy-last.cy);if(tap&&Math.hypot(now.cx-tap.x,now.cy-tap.y)>6)tap.moved=true}else if(last.d>0){zoomAt(now.cx,now.cy,now.d/last.d);panBy(now.cx-last.cx,now.cy-last.cy)}}last=now});
  const up=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size===0){if(tap&&!tap.moved&&performance.now()-tap.t<400)onTap(e.offsetX,e.offsetY);tap=null;last=null}else last=snap()};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,Math.exp(-e.deltaY*0.0016))},{passive:false})}

function buildReelList(){const now=Date.now(),score=p=>p.likes+2/(1+(now-p.ts)/86400000);
  const blocks=new Map();for(const c of S.world.values()){if(!c.photos.length)continue;const g=c.key.slice(0,8);if(!blocks.has(g))blocks.set(g,{g,cells:[],d:Infinity});const b=blocks.get(g);b.cells.push(c);b.d=Math.min(b.d,distM(S.me.lat,S.me.lng,c.lat,c.lng))}
  const myG=OLC.key(S.me.lat,S.me.lng,4),items=[];
  for(const b of [...blocks.values()].sort((a,c)=>a.d-c.d)){const ps=[];for(const c of b.cells){const cov=coverOf(c);for(const p of c.photos)ps.push({p,c,isCover:p===cov,d:distM(S.me.lat,S.me.lng,c.lat,c.lng)})}

  S.photos.delete(id);IMG_CACHE.delete(id);rebuildAgg();closeSheet();renderMyPhotos();renderProfile();updateCamPlace();requestRender();toast(cell&&cell.photos.length?t('deleted'):t('deleted_empty'))}

// ---------- 나
function renderProfile(){renderMyPhotos();const cells=myCells(),myPhotos=[...S.photos.values()].filter(p=>p.user.me),covers=cells.filter(c=>coverOf(c).user.me).length,likes=myPhotos.reduce((s,p)=>s+p.likes,0);
  $('#pf-name').value=S.profile.name;$('#pf-avatar').innerHTML=S.profile.avatar?`<img src="${S.profile.avatar}" alt="">`:esc((S.profile.name||'?')[0]);$('#pf-since').textContent=S.user?(S.user.email||t('google_acct')):t('need_login');
  $('#st-cells').textContent=cells.length;$('#st-photos').textContent=myPhotos.length;$('#st-covers').textContent=covers;$('#st-likes').textContent=likes;
  const pw=(v,m)=>Math.min(100,v/m*100)+'%';$('#sb-cells').style.setProperty('--w',pw(cells.length,20));$('#sb-photos').style.setProperty('--w',pw(myPhotos.length,30));$('#sb-covers').style.setProperty('--w',cells.length?pw(covers,cells.length):'0%');$('#sb-likes').style.setProperty('--w',pw(likes,50));
  const key8=OLC.key(S.me.lat,S.me.lng,4),inBlock=cells.filter(c=>c.key.startsWith(key8)).length,z=key8.slice(4);
  const pct=inBlock/4;$('#ring-num').textContent=pct<10?pct.toFixed(pct?2:0):Math.round(pct);$('#ring-val').setAttribute('stroke-dasharray',`${Math.max(pct/100*424,inBlock?6:0)} 565`);$('#ring-sub').textContent=inBlock?t('ring_sub',{n:inBlock}):t('ring_zero');$('#ring-cap').textContent=t('ring_cap',{z});
  $('#prog-block-label').textContent=t('prog_block',{z});$('#prog-block-val').textContent=`${inBlock}/400`;$('#prog-block').style.width=inBlock?Math.max(1.5,inBlock/4)+'%':'0';
  const EARTH=1440000*2880000;$('#prog-earth-val').textContent=t('prog_earth_val',{n:cells.length,p:(cells.length/EARTH*100).toFixed(12)});$('#prog-earth').style.width=cells.length?'1.5%':'0';
  $('#prog-hint').textContent=t('prog_hint',{n:fmtInt(S.agg[5]?S.agg[5].size:0)});
  $('#loc-label').textContent=S.me.src==='gps'?t('loc_gps')+(S.me.acc?t('loc_acc',{m:Math.round(S.me.acc)}):''):t('loc_none');$('#loc-code').textContent=OLC.format(OLC.key(S.me.lat,S.me.lng))}
function locate(quiet){if(!navigator.geolocation){if(!quiet)toast(t('no_geo'));return}if(!quiet)toast(t('locating'));
  navigator.geolocation.getCurrentPosition(pos=>{const first=S.me.src!=='gps';S.me={lat:pos.coords.latitude,lng:pos.coords.longitude,src:'gps',acc:pos.coords.accuracy};updateCamPlace();renderProfile();if(S.tab==='feed')renderFeed(true);requestRender();if(first||!quiet)centerOn(S.me.lat,S.me.lng,180,true)},
    err=>{console.warn(err);if(!quiet)toast(t('geo_denied'))},{enableHighAccuracy:true,timeout:10000,maximumAge:20000})}

// ---------- 로그인
function needLogin(){$('#login').classList.add('show');return false}
async function initAuth(){if(!sb){toast(t('server_fail'));return}
  const hash=location.hash;if(hash.includes('error=')){const m=new URLSearchParams(hash.slice(1));setTimeout(()=>{$('#login-msg').textContent=t('login_err',{e:m.get('error_description')||m.get('error')})},300)}
  const {data:{session}}=await sb.auth.getSession();await applySession(session);
  sb.auth.onAuthStateChange((_e,s)=>{applySession(s)})}
async function applySession(session){S.user=session?session.user:null;
  if(S.user){const {data}=await sb.from('profiles').select('name,avatar_path').eq('id',S.user.id).maybeSingle();
    if(data){S.profile.name=data.name;S.profile.avatar=data.avatar_path?pubUrl(data.avatar_path):null}else{const nm=(S.user.user_metadata&&(S.user.user_metadata.name||S.user.user_metadata.full_name))||t('traveler');await sb.from('profiles').upsert({id:S.user.id,name:nm});S.profile.name=nm}
    $('#login').classList.remove('show')}else{S.profile.name=t('traveler');$('#login').classList.add('show')}
  await loadWorld();renderProfile()}
async function signInGoogle(){$('#login-msg').textContent=t('login_going');const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)$('#login-msg').textContent=t('login_gerr',{e:error.message})}
async function signInEmail(){const email=$('#login-email').value.trim();if(!email.includes('@')){toast(t('check_email'));return}
  $('#login-msg').textContent=t('login_sending');const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});if(error){$('#login-msg').textContent=t('login_merr',{e:error.message});return}
  $('#login-msg').textContent=t('login_sent',{e:email})}
async function signOut(){await sb.auth.signOut();toast(t('signed_out'))}

// ---------- 카메라
function buildFilterChips(){const sample=sampleSwatch();$('#filters').innerHTML=FILTERS.map(f=>`<button class="fchip${f===S.filter?' on':''}" data-f="${f.id}"><span class="sw"><img src="${sample}" alt="" style="filter:${cssFilter(f)}"></span>${t('f_'+f.id)}</button>`).join('')}
function sampleSwatch(){const c=document.createElement('canvas');c.width=64;c.height=64;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,0,64);g.addColorStop(0,'#FFD6A5');g.addColorStop(.7,'#FF8E72');x.fillStyle=g;x.fillRect(0,0,64,64);x.fillStyle='#3E3A55';x.fillRect(0,40,64,24);x.fillStyle='#FFF6DA';x.beginPath();x.arc(40,18,8,0,7);x.fill();return c.toDataURL()}
function applyPreviewFilter(){const f=S.filter,css=cssFilter(f);$('#video').style.filter=css;$('#shot').style.filter=css;$('#fx-vig').style.setProperty('--vig',f.vig||0);$('#fx-tint').style.setProperty('--tint',f.tint?f.tint.color:'transparent');$$('#filters .fchip').forEach(ch=>ch.classList.toggle('on',ch.dataset.f===f.id))}
function setCamState(st){S.cam.state=st;$('#video').classList.toggle('show',st==='live');$('#shot').classList.toggle('show',st==='review');$('#cam-fallback').classList.toggle('show',st==='fallback');$('#cam-stage').classList.toggle('fb',st==='fallback');
  $('#shutter').hidden=st!=='live';$('#retake').hidden=$('#upload').hidden=$('#orig-row').hidden=st!=='review';$('#orig-toggle').classList.toggle('on',saveOrig);
  $('#cam-status').textContent=st==='starting'?t('cam_prep'):st==='review'?t('cam_review'):'';applyPreviewFilter()}
async function startCamera(){if(S.cam.stream){setCamState(S.cam.shot?'review':'live');return}setCamState('starting');
  try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('no-media');const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:4096},height:{ideal:4096}},audio:false});
    S.cam.stream=st;const v=$('#video');v.srcObject=st;await v.play().catch(()=>{});if(S.tab==='camera')setCamState('live');else stopCamera()}
  catch(e){console.warn('camera unavailable',e);if(S.tab==='camera')setCamState('fallback')}}
function stopCamera(){if(S.cam.stream){S.cam.stream.getTracks().forEach(tr=>tr.stop());S.cam.stream=null}$('#video').srcObject=null}
function cropTo34(src,sw,sh){const TW=720,TH=960;let cw=sw,ch=sh;if(sw/sh>3/4)cw=sh*3/4;else ch=sw*4/3;const c=document.createElement('canvas');c.width=TW;c.height=TH;c.getContext('2d').drawImage(src,(sw-cw)/2,(sh-ch)/2,cw,ch,0,0,TW,TH);return c}
function makeThumbCanvas(src,f){const tc=document.createElement('canvas');tc.width=240;tc.height=320;tc.getContext('2d').drawImage(src,0,0,240,320);return bake(tc,f)}
function canvasBlob(c,q){return new Promise(res=>c.toBlob(res,'image/jpeg',q))}
function setOriginal(src,sw,sh){const c=document.createElement('canvas');c.width=sw;c.height=sh;c.getContext('2d').drawImage(src,0,0,sw,sh);S.cam.orig=c;S.cam.origBlob=null;canvasBlob(c,0.92).then(b=>{S.cam.origBlob=b})}
let saveOrig=localStorage.getItem('ctw-saveorig')!=='0';
const IS_IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
async function saveOriginal(){if(!saveOrig||!S.cam.orig)return;let blob=S.cam.origBlob||await canvasBlob(S.cam.orig,0.92);const name='coverrrup-'+new Date().toISOString().replace(/[:.]/g,'-').slice(0,19)+'.jpg';
  if(IS_IOS){try{const file=new File([blob],name,{type:'image/jpeg'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});toast(t('orig_saved'));return}}catch(e){if(e&&e.name==='AbortError'){toast(t('orig_skip'));return}}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast(t('orig_saved_dl'))}catch(e){toast(t('orig_skip'))}}
function showReview(){$('#shot').src=S.cam.shot.toDataURL('image/jpeg',0.9);setCamState('review')}
function resetShot(){S.cam.shot=null;S.cam.orig=null;S.cam.origBlob=null;$('#shot').removeAttribute('src')}
function updateCamPlace(){const key=OLC.key(S.me.lat,S.me.lng),cell=S.world.get(key),n=cell?cell.photos.length:0;
  const st=S.me.src!=='gps'?t('cam_place_noloc'):n===0?t('cam_place_empty'):t('cam_place_n',{n});
  $('#cam-place').innerHTML=`<span class="mono">${OLC.short(key)}</span><span class="st">${st}</span>`;$('#shutter').disabled=S.me.src!=='gps'}
async function uploadShot(){if(!S.cam.shot)return;if(!S.user)return needLogin();if(S.me.src!=='gps'){toast(t('need_loc'));locate();return}
  const key=OLC.key(S.me.lat,S.me.lng),cell=ensureCell(key);
  const btn=$('#upload');btn.disabled=true;btn.textContent=t('uploading');await saveOriginal();
  try{const id=crypto.randomUUID(),path=`${S.user.id}/${id}.jpg`;
    const [fb,tb]=await Promise.all([canvasBlob(S.cam.shot,0.82),canvasBlob(makeThumbCanvas(S.cam.shot,S.filter),0.75)]);
    const u1=await sb.storage.from('photos').upload(path,fb,{contentType:'image/jpeg'});if(u1.error)throw u1.error;
    const u2=await sb.storage.from('photos').upload(thumbPath(path),tb,{contentType:'image/jpeg'});if(u2.error)throw u2.error;
    const {error}=await sb.from('photos').insert({id,cell:key,lat:S.me.lat,lng:S.me.lng,user_id:S.user.id,filter:S.filter.id,path});
    if(error){await sb.storage.from('photos').remove([path,thumbPath(path)]);throw error}
    const first=cell.photos.length===0;const ph={id,key,user:{id:S.user.id,name:S.profile.name,me:true},ts:Date.now(),likes:0,filter:S.filter.id,path,thumb:pubUrl(thumbPath(path)),full:pubUrl(path)};cell.photos.push(ph);S.photos.set(id,ph);rebuildAgg();
    resetShot();setCamState(S.cam.stream?'live':'fallback');switchTab('map');S.selected=key;map.anims.set(key,performance.now());const b=OLC.bounds(key);requestAnimationFrame(()=>centerOn(b.lat,b.lng,160,true));
    toast(first?t('up_first'):t('up_ok',{n:cell.photos.length}));updateCamPlace();setTimeout(()=>openCellSheet(key),600)}
  catch(e){console.warn(e);toast(t('up_fail',{e:e.message||e}))}
  btn.disabled=false;btn.textContent=t('upload')}

// ---------- 탭 / 이벤트
function switchTab(name){const prev=S.tab;S.tab=name;$$('.screen').forEach(s=>s.classList.toggle('active',s.id==='screen-'+name));$$('.tab').forEach(tb=>tb.classList.toggle('active',tb.dataset.tab===name));
  if(prev==='camera'&&name!=='camera'){stopCamera();resetShot()}
  if(name==='camera'){if(!S.user){needLogin();switchTab(prev==='camera'?'map':prev);return}updateCamPlace();startCamera();if(S.me.src!=='gps')locate(true)}
  if(name==='mine'){maybeReload();renderMine()}if(name==='profile')renderProfile();if(name==='feed'){maybeReload();renderFeed(true)}
  if(name==='map'){maybeReload();requestAnimationFrame(()=>{resizeMap();requestRender()})}}
let toastT;function toast(msg){const tt=$('#toast');tt.textContent=msg;tt.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>tt.classList.remove('show'),2800)}
function handleAction(e){const like=e.target.closest('[data-like]');if(like){toggleLike(like.dataset.like);return true}const cm=e.target.closest('[data-comments]');if(cm){openComments(cm.dataset.comments);return true}
  const go=e.target.closest('[data-goto]');if(go){switchTab(go.dataset.goto);return true}const op=e.target.closest('[data-open-photo]');if(op){openPhotoSheet(op.dataset.openPhoto);return true}const ok=e.target.closest('[data-open-key]');if(ok){const k=ok.dataset.openKey;S.selected=k;if(k.length>=10)openCellSheet(k);else openBlockSheet(k);return true}const ed=e.target.closest('[data-edit]');if(ed){openEditSheet(ed.dataset.edit);return true}const mf=e.target.closest('[data-mf]');if(mf){mineFilter=mf.dataset.mf;renderMine();return true}const oc=e.target.closest('[data-open-cell]');if(oc){S.selected=oc.dataset.openCell;openCellSheet(oc.dataset.openCell);return true}return false}
function bindUI(){$$('.tab').forEach(tb=>tb.addEventListener('click',()=>switchTab(tb.dataset.tab)));
  $('#backdrop').addEventListener('click',closeSheet);
  $('#sheet-body').addEventListener('click',e=>{if(handleAction(e))return;const act=e.target.closest('[data-act]');if(!act)return;const a=act.dataset.act,k=act.dataset.key;
    if(a==='shoot'){closeSheet();switchTab('camera')}else if(a==='zoomto'){const b=OLC.bounds(k);closeSheet();centerOn(b.lat,b.lng,b.res*111320*Math.cos(b.lat*Math.PI/180)*1.25,true)}
    else if(a==='save-photo')savePhotoFilter(k);else if(a==='del-photo'){if(!delArmed){delArmed=true;act.textContent=t('del_confirm');setTimeout(()=>{delArmed=false;if(document.body.contains(act))act.textContent=t('delete')},4000)}else deletePhoto(k)}});
  $('#reels').addEventListener('click',handleAction);$('#reels').addEventListener('scroll',()=>{clearTimeout(reel._t);reel._t=setTimeout(updateReelDist,60)},{passive:true});
  $('#my-photos').addEventListener('click',e=>{const ed=e.target.closest('[data-edit]');if(ed)openEditSheet(ed.dataset.edit)});
  $('#mine-list').addEventListener('click',handleAction);
  const saveName=async()=>{if(!S.user)return needLogin();const v=$('#pf-name').value.trim()||t('traveler');let {error,data}=await sb.from('profiles').update({name:v}).eq('id',S.user.id).select();if(!error&&(!data||!data.length)){({error}=await sb.from('profiles').insert({id:S.user.id,name:v}))}if(error){console.warn(error);toast(t('name_fail')+': '+error.message);return}S.profile.name=v;for(const p of S.photos.values())if(p.user.me)p.user.name=v;renderProfile();toast(t('name_saved'))};
  $('#pf-avatar-in').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;if(!S.user)return needLogin();
    try{const url=URL.createObjectURL(f);const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});URL.revokeObjectURL(url);
      const c=document.createElement('canvas');c.width=c.height=256;const sz=Math.min(im.naturalWidth,im.naturalHeight);c.getContext('2d').drawImage(im,(im.naturalWidth-sz)/2,(im.naturalHeight-sz)/2,sz,sz,0,0,256,256);
      const blob=await canvasBlob(c,0.85),path=`${S.user.id}/avatar.jpg`;const up=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg',upsert:true});if(up.error)throw up.error;
      const {error}=await sb.from('profiles').update({avatar_path:path}).eq('id',S.user.id);if(error)throw error;
      S.profile.avatar=pubUrl(path)+'?v='+Date.now();S.avatars.set(S.user.id,S.profile.avatar);renderProfile();toast(t('avatar_saved'))}
    catch(err){console.warn(err);toast(t('avatar_fail')+': '+(err.message||''))}});
  $('#pf-save').addEventListener('click',saveName);$('#pf-name').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveName();e.target.blur()}});
  $('#loc-gps').addEventListener('click',()=>locate(false));$('#locate').addEventListener('click',()=>{if(S.me.src==='gps')centerOn(S.me.lat,S.me.lng,180,true);else locate(false)});
  $('#zin').addEventListener('click',()=>zoomAt(map.W/2,map.H/2,1.7));$('#zout').addEventListener('click',()=>zoomAt(map.W/2,map.H/2,1/1.7));
  $$('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
  $('#signout').addEventListener('click',signOut);$('#login-google').addEventListener('click',signInGoogle);$('#login-email-btn').addEventListener('click',signInEmail);$('#login-close').addEventListener('click',()=>$('#login').classList.remove('show'));
  $('#filters').addEventListener('click',e=>{const b=e.target.closest('.fchip');if(!b)return;S.filter=FILTERS.find(x=>x.id===b.dataset.f)||FILTERS[0];applyPreviewFilter()});
  $('#shutter').addEventListener('click',async()=>{const v=$('#video');if(!v.videoWidth){toast(t('cam_noframe'));return}const fl=$('#flash');fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go');
    let src=v,sw=v.videoWidth,sh=v.videoHeight;
    try{if(window.ImageCapture&&S.cam.stream){const ic=new ImageCapture(S.cam.stream.getVideoTracks()[0]);const blob=await Promise.race([ic.takePhoto(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('slow')),2500))]);const bm=await createImageBitmap(blob);src=bm;sw=bm.width;sh=bm.height}}catch(e){}
    setOriginal(src,sw,sh);S.cam.shot=cropTo34(src,sw,sh);showReview()});
  $('#retake').addEventListener('click',()=>{resetShot();setCamState(S.cam.stream?'live':'fallback')});
  $('#upload').addEventListener('click',uploadShot);
  $('#orig-toggle').addEventListener('click',()=>{saveOrig=!saveOrig;localStorage.setItem('ctw-saveorig',saveOrig?'1':'0');$('#orig-toggle').classList.toggle('on',saveOrig)});
  $('#file-in').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{setOriginal(im,im.naturalWidth,im.naturalHeight);S.cam.shot=cropTo34(im,im.naturalWidth,im.naturalHeight);URL.revokeObjectURL(url);showReview()};im.onerror=()=>toast(t('img_fail'));im.src=url;e.target.value=''});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stopCamera();else{if(S.tab==='camera'&&S.cam.state==='live')startCamera();maybeReload()}});
  setTimeout(()=>$('#hint').classList.add('hide'),7000)}

// ---------- 시작
async function init(){applyLang();initMap();bindUI();centerOn(S.me.lat,S.me.lng,180);
  let tries=0;const kick=()=>{resizeMap();requestRender();if(map.W<50&&tries++<30)setTimeout(kick,120)};kick();window.addEventListener('resize',()=>{resizeMap();requestRender()});
  await initAuth();locate(true);setInterval(maybeReload,60000)}
init();

})();
</script>
